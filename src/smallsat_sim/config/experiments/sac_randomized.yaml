# Construct a SAC training experiment with randomized fault effects.
vehicle: astrobee_rl
controller: rl
planner: oracle_rl
planner_radius: 0.0
algorithm: sac
run_name: sac_randomized
log: false
headless: true
overrides:
  RL:
    use_adaptive_approach: false
    train_with_failures: true
    rollout_backend: freeflyer
    num_envs: 16
